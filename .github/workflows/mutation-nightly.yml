# Nightly mutation testing (PIT) for a java repo. Called from the repo's
# .github/workflows/mutation-nightly.yml (that file name is what the last-run lookup uses):
#
#   name: mutation-nightly
#   on:
#     schedule:
#       - cron: '0 7 * * *'
#     workflow_dispatch:
#   jobs:
#     mutation:
#       uses: PlantechHubDev/.github/.github/workflows/mutation-nightly.yml@vX.Y.Z
#       permissions:
#         contents: read
#         issues: write
#         actions: read
#         packages: read
#       with:
#         force-failure: ${{ inputs.force-failure || false }}
#       secrets: inherit
#
# (with `workflow_dispatch: inputs: force-failure: {type: boolean, default: false}`, so a
# manual run can prove the alert below.)
#
# The repo's Gradle build declares a `pitest` task that reads the comma-separated class
# globs from -PpitestTargetClasses (none means the whole project) and writes
# build/reports/pitest/mutations.xml (timestampedReports = false). It SHOULD set
# failWhenNoMutations = false, so a night whose changed classes have nothing to mutate
# (interfaces, enums) does not fail and stall the recorded SHA. Such a night writes no
# report; `mutation-survivors.py pit-result` reads PIT's "No mutations found" line and
# counts it as zero survivors (on a full run, where the whole project has nothing to
# mutate, it fails instead). A missing report without that line, tests failing under PIT
# without mutation, or any Gradle error fails the run, so the build MUST NOT set PIT's
# mutationThreshold or coverageThreshold: survivors never fail a run.
#
# A changed test whose production class does not exist (a test named after no class)
# is dropped from the targets, so a night with only such changes skips PIT.
#
# Each night it runs PIT only on what changed on develop since the last successful run
# (the `mutation-state` artifact holds that run's SHA). With no recorded SHA, an expired
# artifact or a SHA that is not an ancestor of develop, it runs the whole project, and
# its first run files every survivor. A night with no src/main or src/test change skips
# PIT but still records the SHA. One open issue per production class, titled
# "Mutation survivors: <fully.qualified.Class>", label mutation-survivor, created with
# this workflow's GITHUB_TOKEN so the dispatcher recognises them (author github-actions).
# An open issue with the same title is never duplicated.
#
# Red nightly alert (job `alert`, after `mutation`, scripts/mutation-alert.sh): a failed or
# cancelled run opens one issue "mutation-nightly red: <repo>" (labels bug, area:test-infra,
# priority:P1) with the failing step and the run link, or comments on that issue when it is
# already open. When Run PIT or the forced step failed it quotes the last 30 lines of the PIT
# log (artifact mutation-failure-log); otherwise it tries the logs API, which may not serve a
# running run's log. The next green run closes it.

name: mutation-nightly

on:
  workflow_call:
    inputs:
      java-version:
        description: Zulu JDK version for Gradle.
        type: string
        default: '17'
      checks-ref:
        description: Tag of PlantechHubDev/.github whose scripts this run uses (mutation-survivors.py). A reusable workflow cannot read its own ref, so the default is bumped in each release; callers normally leave it.
        type: string
        default: v2.7.1
      force-failure:
        description: Fail the mutation job before PIT, to prove the red-nightly alert. Pass it from the caller's workflow_dispatch input.
        type: boolean
        default: false
    secrets:
      PUBLISH_TOKEN:
        description: Reads com.plantechhub packages from GitHub Packages (Maven) during the Gradle build.
        required: true

permissions:
  contents: read
  issues: write
  actions: read
  packages: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # The first run is a full run and may be long.
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
      actions: read
      packages: read
    env:
      # Caller workflow file: the last successful run of it names the last tested SHA.
      CALLER_WORKFLOW: mutation-nightly.yml
    steps:
      - name: Check out develop with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared scripts at checks-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Find the last tested SHA
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/last-state"
          last=""
          run_id=$(gh run list --repo "$REPO" --workflow "$CALLER_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run_id=""
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$REPO" -n mutation-state -D "$RUNNER_TEMP/last-state"; then
            last=$(tr -d '[:space:]' < "$RUNNER_TEMP/last-state/sha.txt" 2>/dev/null || true)
          fi
          if [ -z "$last" ]; then
            echo "No usable mutation-state artifact: full run."
            mode=full
          elif ! git merge-base --is-ancestor "$last" HEAD; then
            echo "Last tested SHA $last is not an ancestor of HEAD: full run."
            mode=full
          else
            echo "Last tested SHA: $last"
            mode=incremental
          fi
          printf 'sha=%s\nmode=%s\n' "$last" "$mode" >> "$GITHUB_OUTPUT"

      - name: Find what changed
        id: changes
        env:
          MODE: ${{ steps.last.outputs.mode }}
          LAST: ${{ steps.last.outputs.sha }}
        run: |
          changed="$RUNNER_TEMP/changed.txt"
          if [ "$MODE" = "full" ]; then
            printf 'run=true\ntargets=\nwhole=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=d "$LAST..HEAD" > "$changed"
          if ! grep -Eq '^src/(main|test)/' "$changed"; then
            echo "No src/main or src/test change since $LAST: skipping PIT."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .pth-checks/scripts/mutation-survivors.py targets --changed "$changed" --root . > "$RUNNER_TEMP/targets.out"
          cat "$RUNNER_TEMP/targets.out"
          targets=$(sed -n 's/^targets=//p' "$RUNNER_TEMP/targets.out")
          whole=$(sed -n 's/^whole=//p' "$RUNNER_TEMP/targets.out")
          if [ -z "$targets" ]; then
            echo "No changed Java class to mutate (resources, test helpers, tests named after no class, or deletions only): skipping PIT."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -U0 "$LAST..HEAD" -- src/main/java > "$RUNNER_TEMP/changes.diff"
          printf 'run=true\ntargets=%s\nwhole=%s\n' "$targets" "$whole" >> "$GITHUB_OUTPUT"

      - name: Forced failure
        id: forced
        if: inputs.force-failure
        run: |
          msg="Forced failure (force-failure input): proving the red-nightly alert."
          echo "$msg" >> "$RUNNER_TEMP/pit.log"
          echo "::error::$msg"
          exit 1

      - name: Set up JDK
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run PIT
        id: pit
        if: steps.changes.outputs.run == 'true'
        env:
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          TARGETS: ${{ steps.changes.outputs.targets }}
        run: |
          set -- -PGITHUB_USER="$PACKAGES_USER" -PGITHUB_TOKEN="$PACKAGES_TOKEN" pitest
          if [ -n "$TARGETS" ]; then
            set -- "$@" "-PpitestTargetClasses=$TARGETS"
          fi
          set +e
          ./gradlew "$@" 2>&1 | tee "$RUNNER_TEMP/pit.log"
          rc=${PIPESTATUS[0]}
          set -e
          set -- --rc "$rc" --log "$RUNNER_TEMP/pit.log" --mutations build/reports/pitest/mutations.xml
          if [ -z "$TARGETS" ]; then
            set -- "$@" --whole-project
          fi
          verdict=0
          python3 .pth-checks/scripts/mutation-survivors.py pit-result "$@" > "$RUNNER_TEMP/pit-result.out" || verdict=$?
          cat "$RUNNER_TEMP/pit-result.out"
          result=$(sed -n 's/^result=//p' "$RUNNER_TEMP/pit-result.out")
          reason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/pit-result.out")
          if [ "$verdict" -ne 0 ]; then
            echo "PIT could not run: ${reason:-pit-result exit $verdict}" >> "$RUNNER_TEMP/pit.log"
            echo "::error::PIT could not run: ${reason:-pit-result exit $verdict}"
            exit 1
          fi
          if [ "$result" = "no-mutations" ]; then
            echo "::notice::PIT found nothing to mutate in the changed classes: zero survivors."
            echo "report=false" >> "$GITHUB_OUTPUT"
          else
            echo "report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find survivors
        if: steps.pit.outputs.report == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TARGETS: ${{ steps.changes.outputs.targets }}
          WHOLE: ${{ steps.changes.outputs.whole }}
        run: |
          set -- --mutations build/reports/pitest/mutations.xml --repo "$REPO_NAME" --sha "$(git rev-parse HEAD)"
          if [ -n "$TARGETS" ]; then
            set -- "$@" --diff "$RUNNER_TEMP/changes.diff" --whole "$WHOLE"
          fi
          python3 .pth-checks/scripts/mutation-survivors.py survivors "$@" > "$RUNNER_TEMP/survivors.json"
          echo "Survivor issues to consider: $(jq length "$RUNNER_TEMP/survivors.json")"

      - name: File one issue per class
        if: steps.pit.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create mutation-survivor --repo "$REPO" --force --color D93F0B --description "Tests that run code without checking it (nightly PIT)"
          gh issue list --repo "$REPO" --label mutation-survivor --state open --limit 1000 --json title --jq '.[].title' > "$RUNNER_TEMP/open-titles.txt"
          jq -c '.[]' "$RUNNER_TEMP/survivors.json" | while IFS= read -r item; do
            title=$(printf '%s' "$item" | jq -r .title)
            if grep -Fxq -- "$title" "$RUNNER_TEMP/open-titles.txt"; then
              echo "Open issue exists, skipping: $title"
              continue
            fi
            printf '%s' "$item" | jq -r .body | gh issue create --repo "$REPO" --label mutation-survivor --title "$title" --body-file -
          done

      - name: Record the tested SHA
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-state"
          git rev-parse HEAD > "$RUNNER_TEMP/mutation-state/sha.txt"

      - name: Upload the tested SHA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-state
          path: ${{ runner.temp }}/mutation-state/sha.txt
          if-no-files-found: error
          retention-days: 90

      # The alert job quotes this: GitHub does not serve a job's log through the API while its
      # run is still going, which it is when the alert runs. Saved only when Run PIT or the
      # forced step failed (or was cancelled), so a later step's failure never quotes a green
      # PIT run; other failures fall back to the logs API. The token is masked, since this
      # file skips GitHub's log masking.
      - name: Save the failure log for the alert
        if: (failure() || cancelled()) && (steps.pit.outcome == 'failure' || steps.pit.outcome == 'cancelled' || steps.forced.outcome == 'failure')
        env:
          MASK: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/pit.log" ]; then
            tail -n 30 "$RUNNER_TEMP/pit.log" | awk 'ENVIRON["MASK"] != "" { m = ENVIRON["MASK"]; while ((i = index($0, m)) > 0) $0 = substr($0, 1, i - 1) "***" substr($0, i + length(m)) } 1' > "$RUNNER_TEMP/mutation-failure.log"
          fi

      - name: Upload the failure log
        if: (failure() || cancelled()) && (steps.pit.outcome == 'failure' || steps.pit.outcome == 'cancelled' || steps.forced.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-failure-log
          path: ${{ runner.temp }}/mutation-failure.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the PIT report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-report
          path: build/reports/pitest
          if-no-files-found: ignore

  alert:
    # Runs after every nightly, red or green, so a red one reaches someone (.github#33).
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Check out the shared scripts at checks-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Fetch the failure log the mutation job saved
        if: needs.mutation.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$REPO" -n mutation-failure-log -D "$RUNNER_TEMP/failure-log" || echo "No saved failure log; the alert falls back to the logs API."

      - name: Open, update or close the red-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.mutation.result }}
        run: bash .pth-checks/scripts/mutation-alert.sh "$REPO" "$RUN_ID" "$RUN_URL" "$RESULT" "$RUNNER_TEMP/failure-log/mutation-failure.log"
