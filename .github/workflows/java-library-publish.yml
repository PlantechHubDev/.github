# Release a java library from its release branch with a computed version.
# Called from the library's publish.yml, on pushes to the release branch:
#
#   on:
#     push:
#       branches: [master]
#   jobs:
#     publish:
#       uses: PlantechHubDev/.github/.github/workflows/java-library-publish.yml@vX.Y.Z
#       permissions:
#         actions: read      # Teams card reads the run
#         contents: write    # pushes the v<version> tag and creates the Release
#         packages: write
#       with:
#         artifact-id: data-library
#         checks-ref: vX.Y.Z   # the same tag, for cliff.toml
#       secrets:
#         PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
#         LIBRARY_WEBHOOK_URI: ${{ secrets.LIBRARY_WEBHOOK_URI }}
#
# Job publish-package:
#   1. git-cliff (pinned, checksum-verified) with this repo's cliff.toml at
#      checks-ref computes the next version V from the commits since the last
#      vX.Y.Z tag: breaking -> major (also from 0.x), feat -> minor, anything
#      else -> patch. The library must already have a vX.Y.Z tag (its
#      starting tag).
#   2. Never overwrite: if com.plantechhub:<artifact-id>:V is in the registry
#      (the caller's .github/scripts/package-version-status.sh), the run is a
#      re-run and skips the build, publish and tag when v<V> already points at
#      this commit; otherwise it fails before publishing.
#   3. RELEASE_VERSION=V ./gradlew clean build, check that the publication
#      version is V (build.gradle reads RELEASE_VERSION), then publish.
#   4. Annotated tag v<V> on this commit, pushed with the job's GITHUB_TOKEN.
#   5. GitHub Release v<V> (created if missing, so a re-run completes it) with
#      the `git cliff --latest` notes and the Maven coordinates.
# Nothing here deletes or prunes old package versions: services pin exact
# versions, and a released version must stay resolvable.
#
# No job here is named ci-ok.

name: java-library-publish

on:
  workflow_call:
    inputs:
      artifact-id:
        description: Maven artifactId under com.plantechhub, e.g. data-library.
        type: string
        required: true
      checks-ref:
        description: Ref (normally the same tag as the uses line) to check out PlantechHubDev/.github at, for cliff.toml.
        type: string
        required: true
      release-branch:
        description: The branch that releases (master, or main where main is still the prod branch). The job fails on any other ref.
        type: string
        default: master
      java-version:
        description: Zulu JDK version for Gradle.
        type: string
        default: '17'
      mysql-test-image:
        description: Exact pth-mysql-test image the tests need, or empty for none. Pulled with the job's GITHUB_TOKEN, so the package must grant this repo Read.
        type: string
        default: ''
      git-cliff-version:
        description: Exact git-cliff version (X.Y.Z) that computes the version and notes.
        type: string
        default: '2.14.2'
      git-cliff-sha256:
        description: SHA-256 of git-cliff-<version>-x86_64-unknown-linux-gnu.tar.gz for git-cliff-version. Change both together.
        type: string
        default: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
    secrets:
      PUBLISH_TOKEN:
        description: Reads and publishes com.plantechhub packages in GitHub Packages (Maven).
        required: true
      LIBRARY_WEBHOOK_URI:
        description: Teams channel webhook for the release card. Without it, no card is sent.
        required: false

permissions:
  contents: read

jobs:
  publish-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release at a time per library: two quick merges must not compute the same version.
    concurrency:
      group: java-library-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      TEAMS_ENABLED: ${{ secrets.LIBRARY_WEBHOOK_URI != '' }}
    steps:
      - name: Check the inputs and the trigger
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          CLIFF_VERSION: ${{ inputs.git-cliff-version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[a-z0-9][a-z0-9.-]*$' || { echo "::error::artifact-id must be lower-case letters, digits, dots and dashes (got '$ARTIFACT_ID')"; exit 1; }
          case "$RELEASE_BRANCH" in
            master|main) ;;
            *) echo "::error::release-branch must be master or main (got '$RELEASE_BRANCH')"; exit 1 ;;
          esac
          printf '%s' "$CLIFF_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::git-cliff-version must be an exact X.Y.Z (got '$CLIFF_VERSION')"; exit 1; }
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::Libraries release only on a push to $RELEASE_BRANCH (got $EVENT on $REF)"
            exit 1
          fi

      - name: Check out the repository (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out PlantechHubDev/.github (cliff.toml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Notification
        if: env.TEAMS_ENABLED == 'true'
        uses: toko-bifrost/ms-teams-deploy-card@288bb1d919f2a1823ecbd8cb1ff5faf9d6ac2a52 # master (3.1.2 plus README-only commits)
        with:
          github-token: ${{ github.token }}
          webhook-uri: ${{ secrets.LIBRARY_WEBHOOK_URI }}
          environment: ${{ github.ref }}
          timezone: "America/New_York"

      - name: Install git-cliff (checksum verified)
        env:
          CLIFF_VERSION: ${{ inputs.git-cliff-version }}
          CLIFF_SHA256: ${{ inputs.git-cliff-sha256 }}
        run: |
          tarball="git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$tarball" "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${tarball}"
          echo "${CLIFF_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          sudo install -m 0755 "git-cliff-${CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Compute the version
        id: version
        run: |
          if ! git tag --merged HEAD --list 'v*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No vX.Y.Z tag is reachable from this commit. Push the library's starting tag first."
            exit 1
          fi
          bumped=$(git cliff --config .pth-checks/cliff.toml --bumped-version)
          version="${bumped#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::git-cliff did not compute an X.Y.Z version (got '$bumped')"
            exit 1
          fi
          echo "Computed version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Never overwrite a published version
        id: guard
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          tag="v$VERSION"
          tag_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          status=$(bash .github/scripts/package-version-status.sh "$ARTIFACT_ID" "$VERSION")
          if [ -n "$tag_commit" ] && [ "$tag_commit" = "$GITHUB_SHA" ]; then
            echo "tag=exists" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag_commit" ]; then
            echo "::error::Tag $tag already exists on $tag_commit, not on this commit ($GITHUB_SHA)"
            exit 1
          else
            echo "tag=new" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" = "exists" ]; then
            if [ "$tag_commit" = "$GITHUB_SHA" ]; then
              echo "::notice::com.plantechhub:$ARTIFACT_ID:$VERSION is already published and $tag points at this commit (a re-run); skipping publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::com.plantechhub:$ARTIFACT_ID:$VERSION is already in the registry but $tag does not point at this commit; refusing to publish"
              exit 1
            fi
          else
            echo "com.plantechhub:$ARTIFACT_ID:$VERSION is new; publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Log in to GHCR (pth-mysql-test image)
        if: steps.guard.outputs.publish == 'true' && inputs.mysql-test-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test DB image (fail fast)
        if: steps.guard.outputs.publish == 'true' && inputs.mysql-test-image != ''
        timeout-minutes: 3
        env:
          IMAGE: ${{ inputs.mysql-test-image }}
        run: |
          timeout 120 docker pull "$IMAGE" || { echo "::error::Cannot pull $IMAGE. It must be published by plantechhubdev/platform-tests (publish-mysql-test workflow), and its package settings (Manage Actions access) must give this repo Read. See platform-tests docs/testing-strategy.md (merge prerequisites)."; exit 1; }
          echo "PTH_MYSQL_TEST_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        if: steps.guard.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build with Gradle
        if: steps.guard.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew -PGITHUB_USER="$PACKAGES_USER" -PGITHUB_TOKEN="$PACKAGES_TOKEN" clean build

      - name: Check the publication version is the computed one
        if: steps.guard.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          published=$(./gradlew -q -PGITHUB_USER="$PACKAGES_USER" -PGITHUB_TOKEN="$PACKAGES_TOKEN" printPublicationVersion | tr -d '\r' | tail -n 1)
          if [ "$published" != "$RELEASE_VERSION" ]; then
            echo "::error::The publication version is '$published', not the computed $RELEASE_VERSION. build.gradle must set it from RELEASE_VERSION."
            exit 1
          fi

      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew -PGITHUB_USER="$PACKAGES_USER" -PGITHUB_TOKEN="$PACKAGES_TOKEN" publish

      - name: Create and push tag v${{ steps.version.outputs.version }}
        if: steps.guard.outputs.tag == 'new'
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          tag="v$VERSION"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$tag" -m "$tag" -m "com.plantechhub:$ARTIFACT_ID:$VERSION" "$GITHUB_SHA"
          # The token reaches git through the environment (as actions/checkout does), never argv or .git/config.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "refs/tags/$tag"

      - name: Create the GitHub Release
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          git cliff --config .pth-checks/cliff.toml --latest > "$notes"
          {
            echo
            echo "### Maven"
            echo
            echo "\`com.plantechhub:$ARTIFACT_ID:$VERSION\` in GitHub Packages:"
            echo
            echo '```groovy'
            echo "implementation 'com.plantechhub:$ARTIFACT_ID:$VERSION'"
            echo '```'
          } >> "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file "$notes"
