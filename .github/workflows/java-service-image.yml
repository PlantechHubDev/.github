# Build the exact commit a merge queue will merge into a multi-arch image, push it to ECR
# as :sha-<first 7 of the commit>, and output its digest. Called from the service's queue
# CI as a job of the ci-ok gate; the pth-sim job then simulates prod on that digest, and
# the release workflow retags it after the merge, so nothing is rebuilt.
#
#   image:
#     uses: PlantechHubDev/.github/.github/workflows/java-service-image.yml@vX.Y.Z
#     permissions:
#       contents: read
#       id-token: write    # OIDC to AWS
#       packages: read     # pth-mysql-test, when mysql-test-image is set
#     with:
#       service-name: calc-service
#       role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
#       checks-ref: vX.Y.Z   # the same tag, so the job runs this tag's scripts
#     secrets:
#       packages-read-token: ${{ secrets.PUBLISH_TOKEN }}
#
# Output digest: sha256:<64 hex> of the pushed image. If :sha-<7> already exists in ECR (a
# queue re-run of the same commit; tags may be immutable) the build is skipped and that
# image's digest is output. The decision and the digest checks live in scripts/ecr-existing-digest.sh
# and scripts/image-digest.sh, which scripts/test-image-digest.sh covers. AWS access is OIDC
# only; the role ARN comes from the caller, never from this public repo.

name: java-service-image

on:
  workflow_call:
    inputs:
      service-name:
        description: The service name, which is also its ECR repository name, e.g. calc-service.
        type: string
        required: true
      java-version:
        description: Zulu JDK version for Gradle.
        type: string
        default: '17'
      mysql-test-image:
        description: Exact pth-mysql-test image the tests need, or empty for none. Pulled with the job's GITHUB_TOKEN, so the package must grant this repo Read.
        type: string
        default: ''
      role-to-assume:
        description: IAM role to assume through OIDC for the ECR push. Pass vars.ECR_PUSH_ROLE_ARN; never write the ARN in a file.
        type: string
        required: true
      checks-ref:
        description: Ref (normally the same tag as the uses line) to check out PlantechHubDev/.github at, for scripts/*.sh.
        type: string
        required: true
    secrets:
      packages-read-token:
        description: Reads com.plantechhub packages from GitHub Packages (Maven) during the Gradle build.
        required: true
    outputs:
      digest:
        description: Digest (sha256:<64 hex>) of the image pushed as sha-<7>.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Check the inputs
        env:
          SERVICE: ${{ inputs.service-name }}
          ROLE: ${{ inputs.role-to-assume }}
        run: |
          printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo "::error::service-name must be lower-case letters, digits and dashes (got '$SERVICE')"; exit 1; }
          [ -n "$ROLE" ] || { echo "::error::role-to-assume is empty: pass vars.ECR_PUSH_ROLE_ARN (an org variable visible to this repo)"; exit 1; }

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute the image tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Look for an existing image
        id: existing
        env:
          SERVICE: ${{ inputs.service-name }}
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
        run: |
          DIGEST=$(bash .pth-checks/scripts/ecr-existing-digest.sh "$SERVICE" "$SHA_TAG") || exit 1
          if [ -n "$DIGEST" ]; then echo "$SHA_TAG already exists in ECR ($DIGEST); skipping the build"; fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.existing.outputs.digest == ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: steps.existing.outputs.digest == ''
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Log in to GHCR (pth-mysql-test image)
        if: steps.existing.outputs.digest == '' && inputs.mysql-test-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test DB image (fail fast)
        if: steps.existing.outputs.digest == '' && inputs.mysql-test-image != ''
        timeout-minutes: 3
        env:
          IMAGE: ${{ inputs.mysql-test-image }}
        run: |
          timeout 120 docker pull "$IMAGE" || { echo "::error::Cannot pull $IMAGE. It must be published by plantechhubdev/platform-tests (publish-mysql-test workflow), and its package settings (Manage Actions access) must give this repo Read. See platform-tests docs/testing-strategy.md (merge prerequisites)."; exit 1; }
          echo "PTH_MYSQL_TEST_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build with Gradle
        if: steps.existing.outputs.digest == ''
        env:
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.packages-read-token }}
        run: ./gradlew -PGITHUB_USER="$PACKAGES_USER" -PGITHUB_TOKEN="$PACKAGES_TOKEN" clean build

      - name: Set up Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Amazon ECR
        id: ecr
        if: steps.existing.outputs.digest == ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push multi-arch image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.service-name }}:${{ steps.tag.outputs.sha_tag }}

      - name: Output the digest
        id: result
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          if [ -n "$EXISTING" ]; then
            DIGEST=$EXISTING
          else
            DIGEST=$(printf '%s' "$METADATA" | bash .pth-checks/scripts/image-digest.sh) || { echo "::error::the build did not report a valid image digest"; exit 1; }
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image digest: $DIGEST"
