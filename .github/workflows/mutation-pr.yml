# PR-time mutation check (PIT) for a java repo: pth-context platform-ops decision 0132,
# .github#32. Called as its own job from the repo's ci.yml, and listed in ci-ok's needs:
#
#   mutation:
#     uses: PlantechHubDev/.github/.github/workflows/mutation-pr.yml@vX.Y.Z
#     permissions:
#       contents: read
#       packages: read
#     secrets:
#       PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
#
#   ci-ok:
#     needs: [checks, build, paired-tests, mutation]
#     ...
#       with:
#         jobs: ${{ toJSON(needs) }}
#         allowed-skips: ${{ github.actor == 'dependabot[bot]' && 'build,mutation' || '' }}
#
# The job skips only on Dependabot runs (no secrets there). Allow the skip only on those runs,
# as above, so a skip from any other cause turns ci-ok red instead of passing silently.
#
# Known gap: a PR that changes only tests or build files maps to no class and skips PIT, so a
# test red only under PIT is caught by the nightly (and its red-nightly issue) the first night
# PIT targets any class, not at the PR (.github#37).
#
# It runs PIT on the classes the PR changed, with the nightly's target mapping and the same
# Gradle `pitest` task the nightly runs (see mutation-nightly.yml for what the build must
# declare; the build MUST NOT set PIT's mutationThreshold or coverageThreshold). It fails
# only when PIT cannot run: tests fail under PIT without mutation (for example a test that
# relies on a system property only Gradle's `test` task sets), a PIT or Gradle error, or no
# report when mutations were found. Surviving mutants never fail it; the nightly files them.
# It skips PIT and passes when the PR changes no class to mutate. On merge_group it diffs
# against the queue's base. Work is in scripts/mutation-pr.sh.
#
# It is a separate workflow, not a job in java-service-ci.yml, so java libraries (which call
# java-library-ci.yml) use the same check, and adopting it moves no other pin.

name: mutation-pr

on:
  workflow_call:
    inputs:
      java-version:
        description: Zulu JDK version for Gradle.
        type: string
        default: '17'
      checks-ref:
        description: Tag of PlantechHubDev/.github whose scripts this run uses (mutation-pr.sh, mutation-survivors.py). A reusable workflow cannot read its own ref, so the default is bumped in each release; callers normally leave it.
        type: string
        default: v2.7.1
    secrets:
      PUBLISH_TOKEN:
        description: Reads com.plantechhub packages from GitHub Packages (Maven) during the Gradle build.
        required: true

permissions:
  contents: read

jobs:
  pit:
    # Dependabot-triggered runs get no Actions secrets, so PUBLISH_TOKEN would be empty and
    # the build would fail; skipped for Dependabot PRs, like java-service-ci.yml's test job.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared scripts at checks-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Find the base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base=${PR_BASE:-$QUEUE_BASE}
          if [ -z "$base" ]; then
            echo "::error::mutation-pr runs on pull_request or merge_group only (got $EVENT_NAME): no base to diff against."
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run PIT on the changed classes
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PACKAGES_USER: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .pth-checks/scripts/mutation-pr.sh "$BASE"

      - name: Upload the PIT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-report-pr
          path: build/reports/pitest
          if-no-files-found: ignore
          retention-days: 7
