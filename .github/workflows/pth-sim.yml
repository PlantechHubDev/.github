# Prod simulation in the merge queue: the full platform-tests suite on the queue image of one
# service, against the images prod is running now. Runs on the self-hosted `pth-test` runner
# (labels self-hosted + pth-test) because it needs the pth-test stack, Docker and a read-only AWS
# SSO session. Called from a trunk repo's queue CI as a job of the
# ci-ok gate, after the image job:
#
#   pth-sim:
#     needs: image
#     uses: PlantechHubDev/.github/.github/workflows/pth-sim.yml@vX.Y.Z
#     permissions:
#       contents: read
#     with:
#       service-name: example-service
#       digest: ${{ needs.image.outputs.digest }}
#       checks-ref: vX.Y.Z   # the same tag, so the job runs this tag's scripts
#
# The work is scripts/pth-sim.sh (covered by scripts/test-pth-sim.sh), which mirrors the
# handbook's pt-verify block (engineering-handbook testing.md, <!-- cmd:pt-verify -->). It reads
# the running prod digest from ECS and resolves it to a commit (scripts/deployed-sha.sh), picks
# the platform-tests commit with pt-ref --release <deployed>..<queue commit>, leases a pth-test
# stack and runs env:up --prod-fleet --image <short>=<registry>/<service>@<digest>, then npm test.
# Exit codes: 0 pass, 1 simulation failed, 2 resolver/setup error, 3 more than one paired
# platform-tests change (split the release), 4 AWS SSO expired (run aws sso login), 5 queue entry
# gone (the queue dropped it while the job waited), 64 usage.
#
# Keeping the pth-test runner to queue runs at a release tag: the job runs only on merge_group
# (job-level if, so a pull_request or push run never dispatches to the runner), and its first
# step, before any checkout, fails unless checks-ref is a release tag (vX.Y.Z), so the runner only
# runs scripts a tag published. The org runner group that holds the pth-test runner is restricted to this
# workflow (PlantechHubDev/.github/.github/workflows/pth-sim.yml) at a tag, so no other workflow,
# and no branch of this one, can reach the runner (configured in the org settings, outside this
# repo).
#
# Timeouts: timeout-minutes is 90. The merge queue's check timeout is 180 minutes, so pth-sim
# (90) plus the image job before it (about 45) stays under it. A runner that is offline or asleep
# stalls the queue until it comes back or the job times out; a job that waited for it does not
# start a stale simulation: pth-sim.sh first checks that the queue entry's branch
# (MG_HEAD_REF, the merge_group head_ref) still exists and exits 5 when it is gone.
#
# Runner environment: the pth-test runner's environment MUST set every one of these (names only
# here; the values live on the runner, never in this public repo). pth-sim.sh exits 64 naming
# each one that is missing.
#   PTH_ECS_CLUSTER           the prod ECS cluster name
#   PTH_ECS_SERVICE_TEMPLATE  the prod ECS service name, with {short} for <service> minus -service
#   PTH_AWS_PROFILE           the read-only AWS SSO profile
#   PTH_STACK_LIB             path of the handbook's pth-stack library
#   PT_REF                    path of the handbook's pt-ref
#   PTH_PT_DIR                path of the platform-tests clone
#   PTH_DEMO_DIR              the demo checkout platform-tests builds the portal from
#   PTH_DOCKER_HOST           the Docker daemon socket, as a DOCKER_HOST value
# GitHub reads (queue branch, pt-ref, commit lookup) use the runner's gh login; AWS reads use the
# SSO profile. No secrets or AWS identifiers are passed from here.

name: pth-sim

on:
  workflow_call:
    inputs:
      service-name:
        description: The service's repo and ECR repository name, e.g. example-service.
        type: string
        required: true
      digest:
        description: The queue image digest (sha256:<64 hex>), from java-service-image.yml's digest output.
        type: string
        required: true
      checks-ref:
        description: Ref (normally the same tag as the uses line) to check out PlantechHubDev/.github at, for scripts/*.sh.
        type: string
        required: true

permissions:
  contents: read

jobs:
  pth-sim:
    name: pth-sim
    # Never dispatched to the pth-test runner outside the merge queue.
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, pth-test]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # One pth-test stack per session (decision 0106); each run attempt is its own session.
      PTH_STACK_SESSION: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Before any checkout: the pth-test runner runs only scripts at a release tag.
      - name: Require checks-ref to be a release tag
        shell: bash
        env:
          CHECKS_REF: ${{ inputs.checks-ref }}
        run: |
          if ! [[ $CHECKS_REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::checks-ref must be a release tag vX.Y.Z (got '$CHECKS_REF'): the pth-test runner runs only tagged scripts"
            exit 1
          fi

      - name: Check out the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      # github.sha is the queue commit in a merge_group run.
      - name: Simulate prod on the queue image
        env:
          SERVICE: ${{ inputs.service-name }}
          DIGEST: ${{ inputs.digest }}
          QUEUE_SHA: ${{ github.sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .pth-checks/scripts/pth-sim.sh "$SERVICE" "$DIGEST" "$QUEUE_SHA"
