# Release a trunk service after its merge queue merged, by deploying :master: nothing is rebuilt
# and no infrastructure PR is opened (pth-context platform-ops decision 0126). In the queue,
# java-service-image.yml pushed the queue commit as <service>:sha-<7> and pth-sim.yml simulated
# prod on it; the queue then fast-forwards master to that exact commit, so on push to master
# github.sha is the simulated commit. The prod service's task definition pins <service>:master,
# so this workflow retags sha-<7> as master and forces a new ECS deployment of the prod service in
# us-east-1. The enqueue is the go for both the merge and the deploy.
#
#   on:
#     push:
#       branches: [master]
#   jobs:
#     release:
#       uses: PlantechHubDev/.github/.github/workflows/java-service-release.yml@vX.Y.Z
#       permissions:
#         contents: read        # service history for the PR list
#         id-token: write       # OIDC to AWS (guard, ECR retag, ECS deploy, read-only checks)
#         actions: read         # the merge_group run of the merged commit (green gate)
#         pull-requests: write  # the deployment comment on each carried PR
#       with:
#         service-name: example-service
#         role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
#         checks-ref: vX.Y.Z   # the same tag, so the job runs this tag's scripts
#         ci-workflow: ci.yml  # the caller's queue CI workflow file
#         # The environment's names: pass them from org or repo variables, never write them here.
#         ecs-cluster: ${{ vars.ECS_CLUSTER }}
#         ecs-service: ${{ vars.ECS_SERVICE }}
#         log-group: ${{ vars.LOG_GROUP }}
#         alarm-prefix: ${{ vars.ALARM_PREFIX }}
#
# Every gate runs before :master moves, because moving :master is itself what a task restart
# deploys. Each step runs only if every step before it succeeded:
#   1. the inputs;
#   2. the green gate (scripts/queue-run-green.sh): the merge_group run of ci-workflow for exactly
#      this commit concluded success, its ci-ok, image and pth-sim jobs succeeded, and no job
#      failed or was cancelled;
#   3. the guard and the retag (scripts/release-image.sh): the running prod service's task
#      definition (the source of truth, read with describe-services and describe-task-definition)
#      must deploy <registry>/<service>:master (else exit 3, no AWS write), sha-<7> must exist in
#      ECR (else exit 2), then sha-<7> is tagged master (same manifest, no rebuild);
#   4. the deployment (scripts/ecs-deploy.sh): update-service --force-new-deployment, then wait
#      for services-stable;
#   5. the post-deploy checks (scripts/post-deploy-checks.sh): every running task on the retagged
#      digest (or a child manifest of its index), deployment COMPLETED at desired count, no ERROR
#      line in the new tasks' log streams since the deploy started, no alarm in ALARM;
#   6. the deployment comment (scripts/deploy-comment.sh) on each service PR the deploy carried,
#      repeated in the step summary.
# A failure before step 3's retag changes nothing in prod. A failure after it fails the run
# loudly: :master already names the new image (the merge was fully green), and recovery is a
# revert PR through the queue, or a change-review record or break-glass for a faster path.
# The scripts are covered by scripts/test-ecs-deploy.sh and scripts/test-ecr-retag.sh; this
# file's structure by scripts/test-workflow-names.sh. No infrastructure repo is read or written.
#
# Tokens: the caller's GITHUB_TOKEN only (no CI App): actions read for the gate, contents read for
# the checkouts, pull-requests write for the comments. AWS
# access is OIDC only, through the deploy role the caller passes; the job runs in environment
# prod, which the role's trust requires. java-service-publish.yml (develop-first repos) is
# unchanged.

name: java-service-release

on:
  workflow_call:
    inputs:
      service-name:
        description: The service's repo and ECR repository name, e.g. example-service.
        type: string
        required: true
      role-to-assume:
        description: The deploy role to assume through OIDC (guard, ECR retag, ECS deploy, read-only checks). Pass vars.DEPLOY_ROLE_ARN; never write the ARN in a file.
        type: string
        required: true
      checks-ref:
        description: Ref (normally the same tag as the uses line) to check out PlantechHubDev/.github at, for scripts/*.sh.
        type: string
        required: true
      ci-workflow:
        description: File name of the caller's merge-queue CI workflow (e.g. ci.yml), whose merge_group run is the green gate.
        type: string
        required: true
      ecs-cluster:
        description: The prod ECS cluster (us-east-1) that runs the service. Pass it from a variable.
        type: string
        required: true
      ecs-service:
        description: The prod ECS service to force a new deployment of. Its task definition must deploy <registry>/<service-name>:master. Pass it from a variable.
        type: string
        required: true
      log-group:
        description: The service's CloudWatch log group, checked for ERROR lines after the deploy. Pass it from a variable.
        type: string
        required: true
      alarm-prefix:
        description: The name prefix of the service's CloudWatch alarms, none of which may be in ALARM after the deploy. Pass it from a variable.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
    concurrency:
      group: release-${{ inputs.service-name }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Check the inputs
        env:
          SERVICE: ${{ inputs.service-name }}
          ROLE: ${{ inputs.role-to-assume }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          ECS_CLUSTER: ${{ inputs.ecs-cluster }}
          ECS_SERVICE: ${{ inputs.ecs-service }}
          LOG_GROUP: ${{ inputs.log-group }}
          ALARM_PREFIX: ${{ inputs.alarm-prefix }}
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::release runs only on push to master (got $GITHUB_EVENT_NAME $GITHUB_REF)"; exit 1; }
          printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo "::error::service-name must be lower-case letters, digits and dashes (got '$SERVICE')"; exit 1; }
          [ -n "$ROLE" ] || { echo "::error::role-to-assume is empty: pass vars.DEPLOY_ROLE_ARN"; exit 1; }
          printf '%s' "$CI_WORKFLOW" | grep -Eq '^[A-Za-z0-9_.-]+\.ya?ml$' || { echo "::error::ci-workflow must be a workflow file name such as ci.yml (got '$CI_WORKFLOW')"; exit 1; }
          for v in ECS_CLUSTER ECS_SERVICE; do
            [[ ${!v} =~ ^[A-Za-z0-9][A-Za-z0-9_./:-]*$ ]] || { echo "::error::${v,,} must be an ECS name (got '${!v}')" | tr _ -; exit 1; }
          done
          [[ $LOG_GROUP =~ ^[A-Za-z0-9_./#-]+$ ]] || { echo "::error::log-group must be a CloudWatch log group name (got '$LOG_GROUP')"; exit 1; }
          [[ -n $ALARM_PREFIX && $ALARM_PREFIX != *[[:space:]]* ]] || { echo "::error::alarm-prefix must be non-empty, with no spaces (got '$ALARM_PREFIX')"; exit 1; }

      - name: Check out the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      # Gate 1: the queue's checks on exactly this commit. No AWS access before it passes.
      - name: Check the merge queue run was green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          URL=$(bash .pth-checks/scripts/queue-run-green.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$CI_WORKFLOW") || exit 1
          echo "Merge queue run: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Full history: the deployment comment lists the merge commits since the deployed one.
      - name: Check out the service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: service
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ env.AWS_REGION }}

      # Gate 2 and the retag: the running prod service deploys <service>:master (else exit 3, no
      # AWS write) and sha-<7> exists (else exit 2); then sha-<7> is tagged master. Writes digest=
      # to GITHUB_OUTPUT.
      - name: Check prod deploys master; tag the simulated image master
        id: retag
        env:
          SERVICE: ${{ inputs.service-name }}
          ECS_CLUSTER: ${{ inputs.ecs-cluster }}
          ECS_SERVICE: ${{ inputs.ecs-service }}
        run: bash .pth-checks/scripts/release-image.sh "$SERVICE" "$GITHUB_SHA" "$ECS_CLUSTER" "$ECS_SERVICE"

      - name: Force a new deployment and wait for it to be stable
        id: deploy
        env:
          ECS_CLUSTER: ${{ inputs.ecs-cluster }}
          ECS_SERVICE: ${{ inputs.ecs-service }}
        run: |
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          bash .pth-checks/scripts/ecs-deploy.sh "$ECS_CLUSTER" "$ECS_SERVICE"

      - name: Post-deploy checks
        env:
          ECS_CLUSTER: ${{ inputs.ecs-cluster }}
          ECS_SERVICE: ${{ inputs.ecs-service }}
          DIGEST: ${{ steps.retag.outputs.digest }}
          SINCE: ${{ steps.deploy.outputs.since }}
          LOG_GROUP: ${{ inputs.log-group }}
          ALARM_PREFIX: ${{ inputs.alarm-prefix }}
        run: bash .pth-checks/scripts/post-deploy-checks.sh "$ECS_CLUSTER" "$ECS_SERVICE" "$DIGEST" "$SINCE" "$LOG_GROUP" "$ALARM_PREFIX"

      - name: Comment on the deployed PRs
        env:
          SERVICE: ${{ inputs.service-name }}
          DIGEST: ${{ steps.retag.outputs.digest }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SERVICE_REPO="$GITHUB_WORKSPACE/service" bash .pth-checks/scripts/deploy-comment.sh "$GITHUB_SHA" "$DIGEST" "$PREVIOUS" "$RUN_URL"

      # Only after a green retag: :master already names the new image, so say so loudly.
      - name: Report a failure after the retag
        if: failure() && steps.retag.outcome == 'success'
        env:
          SERVICE: ${{ inputs.service-name }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          MSG="$SERVICE:master now names $DIGEST (the merge was fully green), but a step after the retag failed: the deployment, its checks or the comment. Recovery is a revert PR through the merge queue; a faster path (retag an older sha-<7> and force a deployment) needs a change-review record first, or break-glass when prod is down."
          echo "::error::$MSG"
          { echo "### Release failed after the retag"; echo; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
