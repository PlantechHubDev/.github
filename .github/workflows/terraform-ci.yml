# Static terraform / terragrunt validation. No credentials, no backend, no
# plan, no apply. Called from the repo's ci.yml:
#
#   validate:
#     uses: PlantechHubDev/.github/.github/workflows/terraform-ci.yml@vX.Y.Z
#     with:
#       mode: modules            # or live
#       terraform-version: 1.3.6
#
# Job validate, by mode:
#   modules  terraform fmt -check -recursive; then per module directory
#            (every directory with a .tf file, setup/ excluded):
#            terraform init -backend=false, terraform validate, tflint
#            failing on errors only.
#   live     terragrunt hclfmt --terragrunt-check per *.hcl file under
#            plantechhub/, with the prod secrets and database units pruned,
#            so they are never opened. No init, no module fetch.
#
# The exclusions are fixed here, not inputs, so a caller can't drop them:
#   setup/ (X-007): orphaned module (no backend, no state); never plan or apply it.
#   plantechhub/us-east-1/prod/secrets and .../prod/database (X-003, X-004):
#   committed plaintext values; never open them.
#
# The caller keeps its own ci-ok job; no job here is named ci-ok.

name: terraform-ci

on:
  workflow_call:
    inputs:
      mode:
        description: "modules (a repo of terraform modules) or live (a terragrunt live repo)."
        type: string
        required: true
      terraform-version:
        description: Exact terraform version, e.g. 1.3.6. Used in modules mode.
        type: string
        required: true
      terragrunt-version:
        description: Exact terragrunt version (with or without a leading v). Used in live mode.
        type: string
        default: '0.45.18'
      terragrunt-sha256:
        description: SHA-256 of terragrunt_linux_amd64 for terragrunt-version. Change both together.
        type: string
        default: 2bb9739a75747f84242bba0c8d92ec5f764446223e832ac709a2536bc31eff87
      tflint-version:
        description: Exact tflint version. Used in modules mode.
        type: string
        default: v0.53.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check the mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            modules|live) echo "mode: $MODE" ;;
            *) echo "::error::mode must be 'modules' or 'live' (got '$MODE')"; exit 1 ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- modules ----

      - name: Set up terraform
        if: inputs.mode == 'modules'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Set up tflint
        if: inputs.mode == 'modules'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: terraform fmt
        if: inputs.mode == 'modules'
        run: terraform fmt -check -recursive

      - name: init (no backend) and validate, then tflint, per module
        if: inputs.mode == 'modules'
        # tflint fails on errors only: the tree has warning-level findings
        # (unused declarations, missing required_version, deprecated index
        # syntax) that are separate cleanup work.
        run: |
          fail=0
          while IFS= read -r d; do
            echo "::group::$d"
            if ! (cd "$d" && terraform init -backend=false -input=false -no-color && terraform validate -no-color && tflint --minimum-failure-severity=error); then
              echo "::error::$d failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name '*.tf' -not -path './.git/*' -not -path './setup/*' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          exit "$fail"

      # ---- live ----

      - name: Install terragrunt (pinned, checksum-verified)
        if: inputs.mode == 'live'
        env:
          TERRAGRUNT_VERSION: ${{ inputs.terragrunt-version }}
          TERRAGRUNT_SHA256: ${{ inputs.terragrunt-sha256 }}
        run: |
          version="v${TERRAGRUNT_VERSION#v}"
          printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::terragrunt-version must be an exact X.Y.Z (got '$TERRAGRUNT_VERSION')"; exit 1; }
          cd "$RUNNER_TEMP"
          curl -fsSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${version}/terragrunt_linux_amd64"
          echo "${TERRAGRUNT_SHA256}  terragrunt" | sha256sum -c -
          sudo install -m 0755 terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: hclfmt check, format only (no init, no module fetch, no credentials)
        if: inputs.mode == 'live'
        # Per file, never per directory, so the pruned units are never opened.
        # Lock files are generated.
        run: |
          find plantechhub \
            \( -path 'plantechhub/us-east-1/prod/secrets' -o -path 'plantechhub/us-east-1/prod/database' \) -prune -o \
            -type f -name '*.hcl' ! -name '.terraform.lock.hcl' -print0 |
            xargs -0 -n1 terragrunt hclfmt --terragrunt-check --terragrunt-hclfmt-file
