# Shared checks every PlantechHubDev repo runs from its own ci.yml:
#
#   checks:
#     uses: PlantechHubDev/.github/.github/workflows/checks.yml@vX.Y.Z
#     with:
#       checks-ref: vX.Y.Z   # the same tag, so CI runs the hook's script
#
# Jobs:
#   secret-scan  gitleaks (pinned container image) over the push, PR or merge-queue range,
#                --redact. Allow-listing: the caller repo's .gitleaks.toml.
#   commit-lint  on pull_request: the branch-name rule, then
#                hooks/check-commit-msg.sh over the PR range; on merge_group:
#                the same check over the queue's range (no branch-name rule), skipped
#                when every non-merge commit there is by dependabot[bot], as on the PR
#                (commit-lint-gate.sh reads the authors from the checkout). On push: a
#                passing no-op (hooks cover local commits; the PR is the gate).
#
# Neither job has a job-level if: skips are steps, so a required check never
# reports "skipped".

name: checks

on:
  workflow_call:
    inputs:
      checks-ref:
        description: Ref (normally the same tag as the uses line) to check out PlantechHubDev/.github at, for hooks/check-commit-msg.sh and scripts/*.sh.
        type: string
        required: true
      gitleaks-image:
        description: gitleaks container image, pinned to an exact tag.
        type: string
        default: ghcr.io/gitleaks/gitleaks:v8.30.1

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared scripts at checks-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .pth-checks/scripts/event-range.sh

      - name: gitleaks
        if: steps.range.outputs.range != ''
        env:
          IMAGE: ${{ inputs.gitleaks-image }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$IMAGE" \
            git /repo --redact --verbose --no-banner --log-opts="$RANGE"

  commit-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared scripts at checks-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PlantechHubDev/.github
          ref: ${{ inputs.checks-ref }}
          path: .pth-checks
          persist-credentials: false

      - name: Decide whether to lint
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .pth-checks/scripts/commit-lint-gate.sh

      - name: Check commit messages
        if: steps.gate.outputs.lint == 'true'
        env:
          RANGE: ${{ steps.gate.outputs.range }}
        run: sh .pth-checks/hooks/check-commit-msg.sh --range "$RANGE"
